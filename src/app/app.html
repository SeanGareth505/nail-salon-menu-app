<sf-branded-splash />
@if (!online()) {
  <div class="offline-shell">
    <sf-offline-state />
  </div>
}
@if (loading.navigating()) {
  <div class="route-progress" role="progressbar" aria-label="Opening page"><span></span></div>
}
<router-outlet />
@if (loading.active()) {
  <sf-loading-overlay [message]="loading.message()" />
}
<sf-pwa-update-banner />
