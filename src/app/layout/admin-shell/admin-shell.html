<div class="shell" [class.menu-open]="menuOpen()" [class.layout-sm]="isNarrow()">
  <sf-admin-sidebar (navigated)="closeMenu()" />

  <div class="main">
    <header class="topbar">
      @if (isNarrow()) {
        <button type="button" class="menu-btn" aria-label="Open menu" (click)="toggleMenu()">
          <span></span>
          <span></span>
          <span class="short"></span>
        </button>
      }
      <h1>{{ pageTitle() }}</h1>
      <div class="topbar-actions">
        <sf-notification-bell [inverted]="isNarrow()" />
        @if (showPageAction()) {
          <button type="button" class="page-action" (click)="onPageAction()">{{ pageAction() }}</button>
        }
      </div>
    </header>

    <div class="content-wrap">
      @if (menuOpen() && isNarrow()) {
        <nav class="mobile-nav" aria-label="Admin navigation">
          @for (item of navItems; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              (click)="closeMenu()"
            >
              <sf-icon [name]="item.icon" [size]="19" />
              {{ item.label }}
            </a>
          }
        </nav>
      }
      <main class="content"><router-outlet /></main>
    </div>
  </div>
</div>
