<div class="dialog-panel" role="dialog" aria-labelledby="complete-dialog-title">
  <header class="panel-header">
    <div class="header-copy">
      <h2 id="complete-dialog-title">{{ data.clientName }}</h2>
      <p class="subtitle">Who reviewed this form and which treatments were performed?</p>
    </div>
    <button type="button" class="close" (click)="dismiss()" aria-label="Close">
      <sf-icon name="close" [size]="18" />
    </button>
  </header>

  <div class="panel-content">
    <sf-consent-form-complete-panel
      [consultationId]="data.consultationId"
      [intendedTherapistId]="data.intendedTherapistId"
      [showHead]="false"
      [embedded]="true"
      [compact]="true"
      (completed)="onCompleted()"
    />
  </div>
</div>
