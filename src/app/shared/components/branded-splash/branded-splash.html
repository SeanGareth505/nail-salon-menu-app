@if (motion.splashVisible()) {
  <div class="splash" [class.leaving]="motion.splashLeaving()" aria-hidden="true">
    <div class="splash-inner">
      <sf-salon-loader size="splash" />
      <p class="wordmark">{{ identity.name() }}</p>
      <p class="tag">{{ identity.subtext() }}</p>
    </div>
  </div>
}
