<div class="page">
  <header class="page-head">
    <div>
      <p class="date">{{ today | date: 'EEEE, d MMMM y' }}</p>
      <h1>{{ greeting() }}</h1>
    </div>
    <a routerLink="/therapist/consent-forms/new" class="cta">Start consent form →</a>
  </header>

  <section class="main-col">
    <div class="section-head">
      <h2>Pending consent forms</h2>
      <a routerLink="/therapist/consent-forms" [queryParams]="{ view: 'history' }" class="history-link">View history</a>
    </div>
    <div class="list">
      @for (c of pending(); track c.id) {
        <article class="pending-card">
          <a class="client-link" [routerLink]="['/therapist/clients', c.clientId]">
            <span class="avatar" [style.background]="avatarBg(c.clientName)" [style.color]="avatarFg(c.clientName)">{{ c.clientName.charAt(0) }}</span>
            <span class="body">
              <span class="name">{{ c.clientName }}</span>
              <span class="meta">Signed {{ whenLabel(c.signedAt) }}</span>
            </span>
          </a>
          <div class="card-end">
            <sf-state-pill [tone]="pillTone(c.status)">{{ statusLabel(c.status) }}</sf-state-pill>
            <a class="action-btn" [routerLink]="['/therapist/consent-forms']" [queryParams]="{ highlight: c.id, complete: '1' }">
              Complete
              <span class="action-arrow" aria-hidden="true">→</span>
            </a>
          </div>
        </article>
      } @empty {
        <sf-empty-state icon="records" title="No pending consent forms" message="Start a new consent form when a client arrives." />
      }
    </div>
  </section>
</div>
