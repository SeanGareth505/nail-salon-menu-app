<div class="auth-page">
  <aside class="auth-brand-panel" aria-hidden="true">
    <div class="auth-brand-panel-inner">
      <div class="monogram-plate">{{ identity.markInitial() }}</div>
      <p class="wordmark">{{ identity.name() }}</p>
      <p class="brand-tagline">{{ identity.tagline() }}</p>
      <p class="brand-subtext">{{ identity.subtext() }}</p>
    </div>
  </aside>

  <main class="auth-main">
    <div class="auth-card sf-card">
      <header class="auth-card-head">
        <p class="sf-eyebrow">Staff portal</p>
        <h1>Admin sign in</h1>
        <p class="subtitle">Email and password for salon owners and managers.</p>
      </header>

      <form class="auth-form" (ngSubmit)="submit()">
        <div class="field">
          <label for="email">Email</label>
          <div class="field-control">
            <input
              id="email"
              type="email"
              autocomplete="email"
              placeholder="you@salon.com"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              name="email"
              required
            />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="field-control">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="Enter your password"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              name="password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            >
              <sf-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
            </button>
          </div>
        </div>

        @if (error()) {
          <p class="error-box" role="alert">{{ error() }}</p>
        }

        <button type="submit" class="submit" [disabled]="loading()">
          {{ loading() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>
    </div>

    <footer class="auth-footer">
      <a routerLink="/therapist/consent-forms/new" class="alt-link">Open tablet consent form</a>
      <div class="auth-footer-divider"></div>
      <a routerLink="/" class="back">Back to the menu</a>
    </footer>
  </main>
</div>
