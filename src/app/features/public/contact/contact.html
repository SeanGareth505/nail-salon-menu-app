<div class="contact-page sf-motion-fade-in">
  <h1>Visit us</h1>

  @if (settings(); as s) {
    <div class="tile-grid">
      <a class="tile call" [href]="'tel:' + s.phone"><sf-icon name="phone" [size]="22" /><span>Call</span></a>
      <a class="tile whatsapp" [href]="'https://wa.me/' + s.whatsapp" target="_blank" rel="noopener"><sf-icon name="whatsapp" [size]="22" /><span>WhatsApp</span></a>
      <a class="tile directions" [href]="mapsUrl(s)" target="_blank" rel="noopener"><sf-icon name="map-pin" [size]="22" /><span>Directions</span></a>
      <a class="tile email" [href]="'mailto:' + s.email"><sf-icon name="mail" [size]="22" /><span>Email</span></a>
    </div>

    <section class="hours">
      <h2 class="hours-label">Opening hours</h2>
      @for (h of s.hours; track h.day) {
        <div class="hours-row" [class.weekday]="isWeekdayRow(h)">
          <span>{{ h.label }}</span>
          <span>{{ hoursLabel(h) }}</span>
        </div>
      }
    </section>

    <section class="map-block">
      <sf-salon-map [settings]="s" title="Salon location map" />
      <p class="address">
        {{ addressText(s) }}
        <span class="desktop-only"> Tap the map for directions.</span>
      </p>
    </section>
  } @else {
    <sf-empty-state-animation motif="generic" title="Contact details coming soon" message="Salon contact information will appear here once it's added." />
  }
</div>
