<div class="admin-page analytics-page" [sfPageAction]="pageAction">
  <header class="admin-head">
    <div>
      <h2>Salon activity</h2>
      <p>Consent form volume and completion, at a glance</p>
    </div>
  </header>

  <p class="page-intro">
    Track consent form volume, completion rate and treatment popularity across your salon.
  </p>

  <div class="stats-grid">
    <sf-stat-tile label="Total consent forms" [value]="consultations().length" />
    <sf-stat-tile label="Completion rate" [value]="completionRate()" />
    <sf-stat-tile label="Unique clients" [value]="uniqueClients()" />
    <sf-stat-tile label="Treatments offered" [value]="treatments().length" />
  </div>

  <section class="breakdown">
    <h2>Completed treatments</h2>
    @for (row of byTreatment(); track row.name) {
      <div class="bar-row">
        <span class="name">{{ row.name }}</span>
        <span class="track"><span class="fill" [style.width.%]="row.pct"></span></span>
        <span class="count">{{ row.count }}</span>
      </div>
    } @empty {
      <p class="empty">No consent form data yet.</p>
    }
  </section>
</div>
