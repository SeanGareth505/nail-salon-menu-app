<div
  (keydown.escape)="closeMenu()"
  class="shell"
  [class.menu-open]="menuOpen()"
  [class.layout-sm]="isNarrow()"
>
  <sf-admin-sidebar (navigated)="closeMenu()" />

  <div class="main">
    <header class="topbar">
      @if (isNarrow()) {
        <button
          type="button"
          class="menu-btn"
          [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="admin-mobile-nav"
          (click)="toggleMenu()"
        >
          <span></span>
          <span></span>
          <span class="short"></span>
        </button>
      }
      <div>
        <span class="workspace-label">SALON WORKSPACE</span>
        <h1>{{ pageTitle() }}</h1>
      </div>
      <div class="topbar-actions">
        <a class="preview-link" routerLink="/"
          >View salon menu <sf-icon name="arrow-right" [size]="14"
        /></a>
        <sf-notification-bell />
        @if (showPageAction()) {
          <button type="button" class="page-action" (click)="onPageAction()">
            {{ pageAction() }}
          </button>
        }
      </div>
    </header>

    <div class="content-wrap">
      @if (menuOpen() && isNarrow()) {
        <nav id="admin-mobile-nav" class="mobile-nav" aria-label="Admin navigation">
          @for (item of navItems; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              (click)="closeMenu()"
            >
              <sf-icon [name]="item.icon" [size]="19" />
              {{ item.label }}
            </a>
          }
        </nav>
      }
      <main class="content" [attr.inert]="menuOpen() && isNarrow() ? '' : null">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
