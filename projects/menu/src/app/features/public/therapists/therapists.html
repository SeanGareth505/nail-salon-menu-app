<section class="page-intro sf-motion-fade-in">
  <p class="sf-script intro-script">Meet the</p>
  <h1>People behind the work</h1>
</section>

<div class="sf-public-page page">
  <div class="team-list">
    @for (t of therapists(); track t.id) {
      <sf-therapist-card [therapist]="t" [full]="true" />
    } @empty {
      <sf-empty-state-animation motif="clients" title="Team profiles coming soon" message="Therapist profiles will appear here once they're added." />
    }
  </div>
</div>
