<div class="shell">
  <a class="skip-link" href="#main-content" (click)="skipToContent($event)">Skip to content</a>
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" routerLink="/" [attr.aria-label]="identity.name() + ' home'">
        <span class="brand-symbol">{{ identity.markInitial() }}</span>
        <span class="brand-name">{{ identity.name() }}<small>BEAUTY & WELLNESS</small></span>
      </a>
      <nav class="desktop-nav" aria-label="Main navigation">
        <a
          routerLink="/"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }"
          >Discover</a
        >
        <a routerLink="/treatments" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Treatments</a
        >
        <a routerLink="/specials" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Specials</a
        >
        <a routerLink="/therapists" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Our team</a
        >
        <a routerLink="/contact" routerLinkActive="active" ariaCurrentWhenActive="page">Visit us</a>
      </nav>
      <a class="booking-link" routerLink="/contact"
        >Plan your visit <sf-icon name="arrow-right" [size]="16"
      /></a>
    </div>
  </header>
  <div class="client-frame">
    <main #mainContent id="main-content" class="content" tabindex="-1"><router-outlet /></main>
    <footer class="site-footer">
      <div>
        <strong>{{ identity.name() }}</strong
        ><span>{{ identity.tagline() }}</span>
      </div>
      <nav aria-label="Footer navigation">
        <a routerLink="/contact">Contact & hours</a
        ><a [href]="staffWorkspaceUrl">Staff workspace</a
        ><a [href]="adminUrl">Admin</a>
      </nav>
      <small>© {{ year }} {{ identity.name() }}</small>
    </footer>
  </div>
  <sf-mobile-nav class="mobile-only" />
</div>
